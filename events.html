<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Events</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
    background:#fff;
    color:#171717;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
}

.events-section{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:16px 12px 30px;
}

/* HEADER */

.events-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.events-title{
    font-size:24px;
    font-weight:800;
    letter-spacing:-.6px;
}

.sequence-dots{
    display:flex;
    align-items:center;
    gap:5px;
    min-height:20px;
}

.sequence-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#c7c7c7;
    transition:
        transform .25s ease,
        background .25s ease,
        opacity .25s ease;
}

.sequence-dot.active{
    background:#151515;
    transform:scale(1.35);
}

/* EVENT CONTAINER */

.events-container{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* EVENT */

.event-card{
    position:relative;
    width:100%;
    aspect-ratio:4 / 5;
    overflow:hidden;
    border-radius:24px;
    background:#f1f1f1;
    contain:layout paint style;
    transform:translateZ(0);
    -webkit-transform:translateZ(0);
}

/* MEDIA */

.event-media{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:#ededed;
}

.event-media img,
.event-media video{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    opacity:0;

    transition:opacity .22s ease;

    background:#ededed;
}

.event-media.ready img,
.event-media.ready video{
    opacity:1;
}

/* SHIMMER */

.skeleton{
    position:absolute;
    inset:0;
    z-index:3;

    background:
        linear-gradient(
            105deg,
            #ededed 20%,
            #f8f8f8 38%,
            #ededed 55%
        );

    background-size:250% 100%;

    animation:
        skeletonShimmer 1.15s linear infinite;
}

.skeleton.done{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:
        opacity .2s ease,
        visibility .2s ease;
}

@keyframes skeletonShimmer{
    from{
        background-position:200% 0;
    }

    to{
        background-position:-50% 0;
    }
}

/* FALLBACK */

.media-fallback{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#999;
    font-size:13px;
}

/* CONTENT */

.event-content{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    z-index:4;

    padding:70px 18px 18px;

    color:#fff;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0,0,0,.08) 25%,
            rgba(0,0,0,.78) 100%
        );
}

.event-name{
    font-size:22px;
    line-height:1.15;
    font-weight:800;
    letter-spacing:-.35px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.event-description{
    margin-top:7px;

    font-size:13px;
    line-height:1.4;

    opacity:.9;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.event-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px;

    margin-top:9px;

    font-size:11px;
    opacity:.86;
}

/* BADGE */

.event-badge{
    position:absolute;
    top:13px;
    left:13px;

    z-index:5;

    padding:6px 10px;

    border-radius:999px;

    background:rgba(0,0,0,.58);
    color:#fff;

    font-size:11px;
    font-weight:700;

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

/* ACTION */

.event-action{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    margin-top:12px;

    min-height:38px;
    padding:0 15px;

    border-radius:12px;

    background:#fff;
    color:#111;

    text-decoration:none;

    font-size:12px;
    font-weight:750;
}

/* ERROR / EMPTY */

.events-state{
    width:100%;
    padding:45px 15px;
    text-align:center;
    color:#888;
    font-size:13px;
}

/* MOBILE */

@media(max-width:600px){

    .events-section{
        padding:
            14px
            10px
            28px;
    }

    .event-card{
        border-radius:21px;
    }

    .event-name{
        font-size:20px;
    }
}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){

    .skeleton{
        animation:none;
    }

    .sequence-dot,
    .event-media img,
    .event-media video{
        transition:none;
    }
}
</style>
</head>

<body>

<section class="events-section">

    <header class="events-header">

        <h1 class="events-title">
            Events
        </h1>

        <div
            id="sequenceDots"
            class="sequence-dots"
            aria-hidden="true">
        </div>

    </header>

    <div
        id="eventsContainer"
        class="events-container">
    </div>

</section>


<script>


/* =========================================================
   API
========================================================= */

const EVENTS_API =
"https://script.google.com/macros/s/AKfycbzx0u4TmwyDUtzLA1SU8Ektg8IObAVJ_yg5aYuGmFU9E1kgW_OeR88Dx1jz74KUZkXRPA/exec";


/* =========================================================
   DOM
========================================================= */

const container =
    document.getElementById(
        "eventsContainer"
    );

const dots =
    document.getElementById(
        "sequenceDots"
    );


/* =========================================================
   SETTINGS
========================================================= */

const MAX_DOTS = 7;

const AUTO_SCROLL_MS =
    5000;

const CACHE_KEY =
    "nova_events_fast_v3";

const CACHE_TIME =
    5 * 60 * 1000;


/* =========================================================
   BASIC HELPERS
========================================================= */

function isObject(value){

    return value !== null &&
           typeof value === "object" &&
           !Array.isArray(value);
}


function text(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value).trim();
}


function escapeHTML(value){

    return text(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   FIND VALUE FROM COMPLEX JSON
========================================================= */

function findValue(
    object,
    names
){

    if(!isObject(object))
        return "";

    const wanted =
        names.map(
            x => x.toLowerCase()
        );


    for(
        const key of Object.keys(object)
    ){

        if(
            wanted.includes(
                key.toLowerCase()
            )
        ){

            const value =
                object[key];

            if(
                typeof value ===
                "string" ||
                typeof value ===
                "number"
            ){

                return text(value);
            }
        }
    }


    return "";
}


/* =========================================================
   FIND URL DEEPLY
========================================================= */

function findMediaURL(
    value,
    depth = 0
){

    if(depth > 7)
        return "";


    if(typeof value === "string"){

        const url =
            value.trim();

        if(
            /^https?:\/\//i.test(url)
        ){

            return url;
        }

        return "";
    }


    if(!isObject(value) &&
       !Array.isArray(value)){

        return "";
    }


    const priorityKeys = [

        "url",
        "src",
        "image",
        "imageUrl",
        "imageURL",
        "video",
        "videoUrl",
        "videoURL",
        "mediaUrl",
        "mediaURL",
        "thumbnail",
        "poster",
        "photo",
        "file",
        "link"

    ];


    if(isObject(value)){

        for(
            const key of priorityKeys
        ){

            if(
                value[key] !== undefined
            ){

                const result =
                    findMediaURL(
                        value[key],
                        depth + 1
                    );

                if(result)
                    return result;
            }
        }
    }


    const values =
        Array.isArray(value)
            ? value
            : Object.values(value);


    for(
        const item of values
    ){

        const result =
            findMediaURL(
                item,
                depth + 1
            );

        if(result)
            return result;
    }


    return "";
}


/* =========================================================
   MEDIA TYPE
========================================================= */

function mediaType(
    url,
    raw
){

    const type =
        findValue(
            raw,
            [
                "mediaType",
                "mime",
                "type",
                "format"
            ]
        ).toLowerCase();


    if(type.includes("video"))
        return "video";


    const source =
        url.toLowerCase();


    if(
        /\.(mp4|webm|m4v|mov)(\?|#|$)/i
            .test(source)
    ){

        return "video";
    }


    return "image";
}


/* =========================================================
   EVENT DETECTION
========================================================= */

function isLikelyEvent(
    object
){

    if(!isObject(object))
        return false;


    const keys =
        Object.keys(object)
            .map(
                key =>
                    key.toLowerCase()
            );


    let score = 0;


    const signals = [

        "event",
        "eventid",
        "eventname",
        "title",
        "name",
        "description",
        "date",
        "time",
        "location",
        "venue",
        "media",
        "image",
        "video"

    ];


    for(
        const signal of signals
    ){

        if(
            keys.some(
                key =>
                    key.includes(signal)
            )
        ){

            score++;
        }
    }


    return score >= 2;
}


/* =========================================================
   DEEP EVENT EXTRACTION
========================================================= */

function extractEvents(
    data
){

    if(Array.isArray(data))
        return data;


    if(!isObject(data))
        return [];


    /* common containers */

    const containers = [

        "events",
        "event",
        "results",
        "items",
        "records",
        "list",
        "data",
        "content"

    ];


    for(
        const key of containers
    ){

        const value =
            data[key];


        if(Array.isArray(value))
            return value;
    }


    const found = [];

    const seen =
        new Set();


    function walk(
        value,
        depth = 0
    ){

        if(depth > 10)
            return;


        if(Array.isArray(value)){

            for(
                const item of value
            ){

                walk(
                    item,
                    depth + 1
                );
            }

            return;
        }


        if(!isObject(value))
            return;


        if(isLikelyEvent(value)){

            try{

                const fingerprint =
                    JSON.stringify(value);

                if(
                    !seen.has(
                        fingerprint
                    )
                ){

                    seen.add(
                        fingerprint
                    );

                    found.push(value);
                }

            }catch{}
        }


        for(
            const child
            of Object.values(value)
        ){

            if(
                isObject(child) ||
                Array.isArray(child)
            ){

                walk(
                    child,
                    depth + 1
                );
            }
        }
    }


    walk(data);

    return found;
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeEvent(
    raw
){

    if(!isObject(raw))
        return null;


    const content =
        isObject(raw.content)
            ? raw.content
            : {};


    const media =
        isObject(raw.media)
            ? raw.media
            : {};


    const title =
        findValue(
            raw,
            [
                "eventName",
                "title",
                "name"
            ]
        ) ||
        findValue(
            content,
            [
                "eventName",
                "title",
                "name"
            ]
        );


    const description =
        findValue(
            raw,
            [
                "description",
                "desc",
                "details"
            ]
        ) ||
        findValue(
            content,
            [
                "description",
                "desc",
                "details"
            ]
        );


    const date =
        findValue(
            raw,
            [
                "date",
                "eventDate"
            ]
        ) ||
        findValue(
            content,
            [
                "date",
                "eventDate"
            ]
        );


    const time =
        findValue(
            raw,
            [
                "time",
                "eventTime"
            ]
        ) ||
        findValue(
            content,
            [
                "time",
                "eventTime"
            ]
        );


    const location =
        findValue(
            raw,
            [
                "location",
                "venue",
                "place"
            ]
        ) ||
        findValue(
            content,
            [
                "location",
                "venue",
                "place"
            ]
        );


    const badge =
        findValue(
            raw,
            [
                "badge",
                "label"
            ]
        ) ||
        findValue(
            content,
            [
                "badge",
                "label"
            ]
        );


    const mediaURL =
        findMediaURL(
            media
        ) ||
        findMediaURL(
            raw
        );


    const type =
        mediaType(
            mediaURL,
            raw
        );


    let actionURL =
        findValue(
            raw,
            [
                "actionUrl",
                "actionURL",
                "link",
                "href"
            ]
        );


    if(!actionURL &&
       isObject(raw.action)){

        actionURL =
            findValue(
                raw.action,
                [
                    "url",
                    "href",
                    "link"
                ]
            );
    }


    const actionLabel =
        (
            isObject(raw.action)
                ? findValue(
                    raw.action,
                    [
                        "label",
                        "text",
                        "title"
                    ]
                )
                : ""
        ) ||
        "View Event";


    return {

        id:
            findValue(
                raw,
                [
                    "id",
                    "eventId",
                    "eventID"
                ]
            ),

        title:
            title || "Event",

        description,

        date,

        time,

        location,

        badge,

        mediaURL,

        mediaType:type,

        actionURL,

        actionLabel,

        raw
    };
}


/* =========================================================
   SKELETON
========================================================= */

function createSkeleton(){

    const card =
        document.createElement(
            "article"
        );

    card.className =
        "event-card";


    card.innerHTML = `

        <div class="event-media">

            <div class="skeleton"></div>

        </div>

    `;


    return card;
}


function showSkeletons(){

    container.innerHTML = "";

    const fragment =
        document.createDocumentFragment();


    for(
        let i = 0;
        i < 2;
        i++
    ){

        fragment.appendChild(
            createSkeleton()
        );
    }


    container.appendChild(
        fragment
    );
}


/* =========================================================
   IMAGE / VIDEO LOADING
========================================================= */

function attachMedia(
    wrapper,
    event
){

    const skeleton =
        wrapper.querySelector(
            ".skeleton"
        );


    if(!event.mediaURL){

        skeleton?.classList.add(
            "done"
        );

        wrapper.insertAdjacentHTML(
            "beforeend",
            `<div class="media-fallback">
                No media
            </div>`
        );

        return;
    }


    const url =
        event.mediaURL;


    if(
        event.mediaType ===
        "video"
    ){

        const video =
            document.createElement(
                "video"
            );


        video.src = url;

        video.preload =
            "metadata";

        video.muted = true;

        video.playsInline = true;

        video.loop = true;

        video.controls = false;

        video.setAttribute(
            "playsinline",
            ""
        );


        video.addEventListener(
            "loadeddata",
            () => {

                wrapper.classList.add(
                    "ready"
                );

                skeleton?.classList.add(
                    "done"
                );

            },
            {
                once:true
            }
        );


        video.addEventListener(
            "error",
            () => {

                skeleton?.classList.add(
                    "done"
                );

                video.remove();

                wrapper.insertAdjacentHTML(
                    "beforeend",
                    `<div class="media-fallback">
                        Media unavailable
                    </div>`
                );

            },
            {
                once:true
            }
        );


        wrapper.appendChild(
            video
        );


        return;
    }


    const image =
        document.createElement(
            "img"
        );


    image.alt =
        event.title;


    image.loading =
        "lazy";


    image.decoding =
        "async";


    image.setAttribute(
        "fetchpriority",
        "low"
    );


    image.addEventListener(
        "load",
        () => {

            wrapper.classList.add(
                "ready"
            );

            skeleton?.classList.add(
                "done"
            );

        },
        {
            once:true
        }
    );


    image.addEventListener(
        "error",
        () => {

            skeleton?.classList.add(
                "done"
            );

            image.remove();

            wrapper.insertAdjacentHTML(
                "beforeend",
                `<div class="media-fallback">
                    Media unavailable
                </div>`
            );

        },
                {
            once: true
        }
    );
}

function createCard(event, index) {
    const card = document.createElement("article");
    card.className = "event-card";

    const mediaWrapper = document.createElement("div");
    mediaWrapper.className = "event-media";

    const content = document.createElement("div");
    content.className = "event-content";

    const title = document.createElement("h3");
    title.className = "event-title";
    title.textContent = event.title || "Event";

    content.appendChild(title);

    if (event.description) {
        const description = document.createElement("p");
        description.className = "event-description";
        description.textContent = event.description;
        content.appendChild(description);
    }

    const meta = document.createElement("div");
    meta.className = "event-meta";

    if (event.date) {
        const date = document.createElement("span");
        date.textContent = event.date;
        meta.appendChild(date);
    }

    if (event.time) {
        const time = document.createElement("span");
        time.textContent = event.time;
        meta.appendChild(time);
    }

    if (event.location) {
        const location = document.createElement("span");
        location.textContent = event.location;
        meta.appendChild(location);
    }

    if (meta.children.length) {
        content.appendChild(meta);
    }

    if (event.actionURL) {
        const action = document.createElement("a");
        action.className = "event-action";
        action.href = event.actionURL;
        action.target = "_blank";
        action.rel = "noopener noreferrer";
        action.textContent = event.actionLabel || "View Event";

        content.appendChild(action);
    }

    if (event.mediaURL) {
        attachMedia(
            mediaWrapper,
            event.mediaURL,
            event.mediaType
        );
    }

    if (event.badge) {
        const badge = document.createElement("span");
        badge.className = "event-badge";
        badge.textContent = event.badge;
        mediaWrapper.appendChild(badge);
    }

    card.appendChild(mediaWrapper);
    card.appendChild(content);

    return card;
}

function createDots(count) {
    sequenceDots.innerHTML = "";

    for (let i = 0; i < count; i++) {
        const dot = document.createElement("span");

        dot.className =
            "sequence-dot" + (i === 0 ? " active" : "");

        sequenceDots.appendChild(dot);
    }
}

function updateDots(index) {
    const dots =
        sequenceDots.querySelectorAll(".sequence-dot");

    dots.forEach((dot, i) => {
        dot.classList.toggle(
            "active",
            i === index
        );
    });
}

const CACHE_KEY = "nova_events_fast_v3";
const CACHE_TIME = 5 * 60 * 1000;

function saveCache(data) {
    try {
        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
                time: Date.now(),
                data
            })
        );
    } catch (e) {}
}

function getCache() {
    try {
        const cached =
            JSON.parse(
                localStorage.getItem(CACHE_KEY)
            );

        if (!cached) return null;

        if (
            Date.now() - cached.time >
            CACHE_TIME
        ) {
            return null;
        }

        return cached.data;

    } catch (e) {
        return null;
    }
      }
      }

async function fetchEvents() {
    const controller = new AbortController();

    const timeout = setTimeout(
        () => controller.abort(),
        10000
    );

    try {
        const response = await fetch(
            EVENTS_API,
            {
                method: "GET",
                mode: "cors",
                credentials: "omit",
                cache: "no-store",
                headers: {
                    "Accept": "application/json"
                },
                signal: controller.signal
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data = await response.json();

        saveCache(data);

        return data;

    } finally {
        clearTimeout(timeout);
    }
}

function render(events) {
    eventsContainer.innerHTML = "";

    if (!events || !events.length) {
        createDots(0);
        return;
    }

    createDots(events.length);

    const fragment =
        document.createDocumentFragment();

    events.forEach((raw, index) => {
        try {
            const event =
                normalizeEvent(raw);

            if (!event.enabled) return;

            const card =
                createCard(event, index);

            fragment.appendChild(card);

        } catch (error) {
            console.warn(
                "Event skipped:",
                error
            );
        }
    });

    eventsContainer.appendChild(fragment);
}

async function loadEvents() {
    const cached = getCache();

    if (cached) {
        try {
            const events =
                extractEvents(cached);

            render(events);
        } catch (error) {
            console.warn(
                "Cache render failed:",
                error
            );
        }
    }

    try {
        const data =
            await fetchEvents();

        const events =
            extractEvents(data);

        render(events);

    } catch (error) {
        console.warn(
            "Event fetch failed:",
            error
        );

        if (!cached) {
            eventsContainer.innerHTML = "";
        }
    }
}

    setInterval(() => {
        const cards =
            eventsContainer.querySelectorAll(

            );

let touchStartY = 0;

eventsContainer.addEventListener(
    "touchstart",
    (event) => {
        const touch = event.touches[0];

        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    },
    {
        passive: true
    }
);

eventsContainer.addEventListener(
    "touchend",
    (event) => {
        const touch = event.changedTouches[0];

        const deltaX =
            touch.clientX - touchStartX;

        const deltaY =
            touch.clientY - touchStartY;

        /*
         * Ignore normal vertical scrolling.
         * Only react to a clear horizontal swipe.
         */
        if (
            Math.abs(deltaX) < 60 ||
            Math.abs(deltaX) < Math.abs(deltaY)
        ) {
            return;
        }

        const cards =
            eventsContainer.querySelectorAll(
                ".event-card"
            );

        if (!cards.length) return;

        let currentIndex = 0;

        cards.forEach((card, index) => {
            const rect =
                card.getBoundingClientRect();

            const containerRect =
                eventsContainer.getBoundingClientRect();

            const cardCenter =
                rect.top + rect.height / 2;

            const containerCenter =
                containerRect.top +
                containerRect.height / 2;

            if (
                Math.abs(
                    cardCenter - containerCenter
                ) <
                Math.abs(
                    cards[currentIndex]
                        .getBoundingClientRect()
                        .top +
                    cards[currentIndex]
                        .getBoundingClientRect()
                        .height / 2 -
                    containerCenter
                )
            ) {
                currentIndex = index;
            }
        });

        /*
         * Swipe left → next event
         * Swipe right → previous event
         */
        if (deltaX < 0) {
            currentIndex =
                Math.min(
                    currentIndex + 1,
                    cards.length - 1
                );
        } else {
            currentIndex =
                Math.max(
                    currentIndex - 1,
                    0
                );
        }

        cards[currentIndex].scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        updateDots(currentIndex);
    },
    {
        passive: true
    }
);

    extract: extractEvents,

    normalize: normalizeEvent
};

setInterval(
    () => {
        if (
            document.visibilityState ===
            "visible"
        ) {
            loadEvents();
        }
    },
    5 * 60 * 1000
);
