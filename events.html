<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #111111;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
    overflow-x: hidden;
}

/* =========================
   EVENTS SECTION
========================= */

.events-section {
    width: 100%;
    padding: 18px 14px 28px;
}

.events-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.events-title {
    margin: 0;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.sequence-dots {
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 18px;
}

.sequence-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c7c7c7;
    transition:
        width .2s ease,
        background .2s ease,
        transform .2s ease;
}

.sequence-dot.active {
    width: 18px;
    border-radius: 10px;
    background: #111111;
}

/* =========================
   HORIZONTAL EVENT CONTAINER
========================= */

.events-container {
    width: 100%;

    display: flex;
    gap: 12px;

    overflow-x: auto;
    overflow-y: hidden;

    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    touch-action: pan-x;
}

.events-container::-webkit-scrollbar {
    display: none;
}

/* =========================
   EVENT CARD
========================= */

.event-card {
    position: relative;

    flex: 0 0 100%;

    width: 100%;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    border-radius: 22px;

    background: #eeeeee;

    scroll-snap-align: center;

    user-select: none;

    contain: layout paint;
}

/* =========================
   IMAGE
========================= */

.event-card img,
.event-card video {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    opacity: 0;

    transition: opacity .25s ease;
}

.event-card.media-ready img,
.event-card.media-ready video {
    opacity: 1;
}

/* =========================
   SHIMMER
========================= */

.shimmer {
    position: absolute;

    inset: 0;

    z-index: 2;

    background:
        linear-gradient(
            100deg,
            #eeeeee 20%,
            #f8f8f8 40%,
            #eeeeee 60%
        );

    background-size: 220% 100%;

    animation:
        shimmerMove 1.15s linear infinite;
}

@keyframes shimmerMove {

    0% {
        background-position: 200% 0;
    }

    100% {
        background-position: -20% 0;
    }
}

.shimmer.hidden {
    opacity: 0;
    visibility: hidden;
}

/* =========================
   CARD CONTENT
========================= */

.event-content {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 4;

    padding: 60px 18px 18px;

    color: #ffffff;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.82)
        );
}

.event-name {
    margin: 0;

    font-size: 22px;
    line-height: 1.15;

    font-weight: 800;

    display: -webkit-box;

    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.event-id {
    margin-top: 6px;

    font-size: 11px;

    opacity: .72;

    letter-spacing: .3px;
}

/* =========================
   SWIPE HINT
========================= */

.swipe-indicator {
    position: absolute;

    right: 14px;
    top: 50%;

    z-index: 8;

    width: 34px;
    height: 34px;

    border-radius: 50%;

    display: grid;
    place-items: center;

    color: white;

    background: rgba(0,0,0,.38);

    backdrop-filter: blur(8px);

    pointer-events: none;

    opacity: .8;
}

.swipe-indicator::before {
    content: "›";

    font-size: 25px;

    line-height: 1;
}

/* =========================
   EMPTY / ERROR
========================= */

.events-state {
    width: 100%;

    min-height: 100px;

    display: grid;
    place-items: center;

    color: #888888;

    font-size: 13px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .events-section {
        padding-left: 12px;
        padding-right: 12px;
    }

    .event-card {
        border-radius: 20px;
    }

    .event-name {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<section class="events-section">

    <header class="events-header">

        <h2 class="events-title">
            Events
        </h2>

        <div
            id="sequenceDots"
            class="sequence-dots"
            aria-hidden="true">
        </div>

    </header>

    <div
        id="eventsContainer"
        class="events-container">
    </div>

</section>


<script>
"use strict";

/* =========================================================
   API
========================================================= */

const EVENTS_API =
"https://script.google.com/macros/s/AKfycbzx0u4TmwyDUtzLA1SU8Ektg8IObAVJ_yg5aYuGmFU9E1kgW_OeR88Dx1jz74KUZkXRPA/exec";


/* =========================================================
   ELEMENTS
========================================================= */

const eventsContainer =
    document.getElementById("eventsContainer");

const sequenceDots =
    document.getElementById("sequenceDots");


/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   EXTRACT EVENTS
   Supports:
   [
      {...}
   ]

   OR

   {
      events: [...]
   }

   OR

   {
      data: [...]
   }

   OR

   {
      results: [...]
   }
========================================================= */

function extractEvents(json) {

    if (Array.isArray(json)) {
        return json;
    }

    if (!json || typeof json !== "object") {
        return [];
    }

    const possibleKeys = [
        "events",
        "data",
        "results",
        "items",
        "records"
    ];

    for (const key of possibleKeys) {

        if (Array.isArray(json[key])) {
            return json[key];
        }
    }

    return [];
}


/* =========================================================
   GET FIELD
========================================================= */

function getField(object, keys) {

    if (!object ||
        typeof object !== "object") {
        return "";
    }

    for (const key of keys) {

        if (
            object[key] !== undefined &&
            object[key] !== null &&
            object[key] !== ""
        ) {
            return object[key];
        }
    }

    return "";
}


/* =========================================================
   NORMALIZE EVENT
========================================================= */

function normalizeEvent(event) {

    if (!event ||
        typeof event !== "object") {
        return null;
    }

    const id =
        getField(
            event,
            [
                "id",
                "eventId",
                "eventID",
                "ID",
                "Id"
            ]
        );

    const name =
        getField(
            event,
            [
                "name",
                "eventName",
                "eventname",
                "title",
                "Event Name",
                "Name",
                "Title"
            ]
        );

    const image =
        getField(
            event,
            [
                "image",
                "imageUrl",
                "imageURL",
                "img",
                "photo",
                "thumbnail",
                "src",
                "url"
            ]
        );

    const video =
        getField(
            event,
            [
                "video",
                "videoUrl",
                "videoURL"
            ]
        );

    return {

        id: id || "",

        name:
            name || "Event",

        image:
            image || "",

        video:
            video || ""
    };
}


/* =========================================================
   MEDIA TYPE
========================================================= */

function isVideo(url) {

    if (!url) {
        return false;
    }

    const value =
        String(url).toLowerCase();

    return (
        value.includes(".mp4") ||
        value.includes(".webm") ||
        value.includes(".m4v") ||
        value.includes(".mov")
    );
}


/* =========================================================
   CREATE SKELETON
========================================================= */

function createSkeleton() {

    const fragment =
        document.createDocumentFragment();

    for (let i = 0; i < 2; i++) {

        const card =
            document.createElement("div");

        card.className =
            "event-card";

        card.innerHTML = `
            <div class="shimmer"></div>
        `;

        fragment.appendChild(card);
    }

    eventsContainer.appendChild(
        fragment
    );
}


/* =========================================================
   CREATE EVENT CARD
========================================================= */

function createEventCard(event) {

    const card =
        document.createElement("article");

    card.className =
        "event-card";

    card.dataset.id =
        event.id;


    const mediaURL =
        event.video ||
        event.image;


    /* SHIMMER */

    const shimmer =
        document.createElement("div");

    shimmer.className =
        "shimmer";

    card.appendChild(shimmer);


    /* MEDIA */

    if (mediaURL) {

        if (isVideo(mediaURL)) {

            const video =
                document.createElement("video");

            video.src =
                mediaURL;

            video.muted = true;

            video.playsInline = true;

            video.preload = "metadata";

            video.setAttribute(
                "aria-label",
                event.name
            );

            video.addEventListener(
                "loadeddata",
                () => {

                    card.classList.add(
                        "media-ready"
                    );

                    shimmer.classList.add(
                        "hidden"
                    );

                },
                {
                    once: true
                }
            );

            card.appendChild(video);

        } else {

            const image =
                document.createElement("img");

            image.src =
                mediaURL;

            image.alt =
                event.name;

            image.loading =
                "lazy";

            image.decoding =
                "async";

            image.addEventListener(
                "load",
                () => {

                    card.classList.add(
                        "media-ready"
                    );

                    shimmer.classList.add(
                        "hidden"
                    );

                },
                {
                    once: true
                }
            );

            image.addEventListener(
                "error",
                () => {

                    shimmer.classList.add(
                        "hidden"
                    );

                },
                {
                    once: true
                }
            );

            card.appendChild(image);
        }
    } else {

        shimmer.classList.add(
            "hidden"
        );
    }


    /* CONTENT */

    const content =
        document.createElement("div");

    content.className =
        "event-content";

    content.innerHTML = `

        <h3 class="event-name">
            ${escapeHTML(event.name)}
        </h3>

        ${
            event.id
            ? `
                <div class="event-id">
                    ID • ${escapeHTML(event.id)}
                </div>
            `
            : ""
        }

    `;

    card.appendChild(content);


    return card;
}


/* =========================================================
   DOTS
========================================================= */

function createDots(count) {

    sequenceDots.innerHTML = "";

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const dot =
            document.createElement("span");

        dot.className =
            "sequence-dot";

        if (i === 0) {
            dot.classList.add(
                "active"
            );
        }

        sequenceDots.appendChild(dot);
    }
}


/* =========================================================
   ACTIVE DOT
========================================================= */

function updateActiveDot() {

    const cards =
        eventsContainer.querySelectorAll(
            ".event-card"
        );

    const dots =
        sequenceDots.querySelectorAll(
            ".sequence-dot"
        );

    if (!cards.length)
        return;


    const center =
        eventsContainer.scrollLeft +
        eventsContainer.clientWidth / 2;


    let closestIndex = 0;

    let closestDistance =
        Infinity;


    cards.forEach(
        (card, index) => {

            const cardCenter =
                card.offsetLeft +
                card.offsetWidth / 2;

            const distance =
                Math.abs(
                    center -
                    cardCenter
                );

            if (
                distance <
                closestDistance
            ) {

                closestDistance =
                    distance;

                closestIndex =
                    index;
            }
        }
    );


    dots.forEach(
        (dot, index) => {

            dot.classList.toggle(
                "active",
                index ===
                closestIndex
            );
        }
    );
}


/* =========================================================
   RENDER
========================================================= */

function renderEvents(data) {

    const rawEvents =
        extractEvents(data);


    const events =
        rawEvents
            .map(normalizeEvent)
            .filter(Boolean);


    eventsContainer.innerHTML = "";


    if (!events.length) {

        eventsContainer.innerHTML = `
            <div class="events-state">
                No events
            </div>
        `;

        sequenceDots.innerHTML = "";

        return;
    }


    createDots(
        events.length
    );


    const fragment =
        document.createDocumentFragment();


    events.forEach(
        event => {

            fragment.appendChild(
                createEventCard(event)
            );
        }
    );


    eventsContainer.appendChild(
        fragment
    );


    updateActiveDot();
}


/* =========================================================
   FETCH
========================================================= */

async function fetchEvents() {

    const response =
        await fetch(
            EVENTS_API,
            {
                method: "GET",

                cache: "no-store",

                credentials: "omit",

                headers: {
                    "Accept":
                        "application/json"
                }
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );
    }


    return await response.json();
}


/* =========================================================
   LOAD
========================================================= */

async function loadEvents() {

    createSkeleton();

    try {

        const data =
            await fetchEvents();

        renderEvents(data);

    } catch (error) {

        console.error(
            "Events API error:",
            error
        );

        eventsContainer.innerHTML = `
            <div class="events-state">
                Events unavailable
            </div>
        `;

        sequenceDots.innerHTML = "";
    }
}


/* =========================================================
   SCROLL → DOT SEQUENCE
========================================================= */

let scrollTimer;

eventsContainer.addEventListener(
    "scroll",
    () => {

        updateActiveDot();

        clearTimeout(
            scrollTimer
        );

        scrollTimer =
            setTimeout(
                updateActiveDot,
                80
            );

    },
    {
        passive: true
    }
);


/* =========================================================
   AUTO SCROLL
========================================================= */

let autoScrollTimer;

function startAutoScroll() {

    stopAutoScroll();

    autoScrollTimer =
        setInterval(
            () => {

                const cards =
                    eventsContainer.querySelectorAll(
                        ".event-card"
                    );

                if (
                    cards.length <= 1
                ) {
                    return;
                }


                const current =
                    Math.round(
                        eventsContainer.scrollLeft /
                        eventsContainer.clientWidth
                    );


                const next =
                    (current + 1) %
                    cards.length;


                eventsContainer.scrollTo({

                    left:
                        cards[next].offsetLeft,

                    behavior:
                        "smooth"
                });

            },
            4000
        );
}


function stopAutoScroll() {

    if (autoScrollTimer) {

        clearInterval(
            autoScrollTimer
        );

        autoScrollTimer =
            null;
    }
}


/* =========================================================
   TOUCH / INTERACTION
========================================================= */

eventsContainer.addEventListener(
    "pointerdown",
    stopAutoScroll,
    {
        passive: true
    }
);

eventsContainer.addEventListener(
    "pointerup",
    startAutoScroll,
    {
        passive: true
    }
);

eventsContainer.addEventListener(
    "pointercancel",
    startAutoScroll,
    {
        passive: true
    }
);


/* =========================================================
   START
========================================================= */

loadEvents()
    .then(() => {
        startAutoScroll();
    });


/* =========================================================
   REFRESH
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            loadEvents()
                .then(() => {
                    startAutoScroll();
                });
        }
    }
);

</script>

</body>
    </html>
