<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Events</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;background:#fff;color:#171717;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden;-webkit-font-smoothing:antialiased}
.events-section{width:100%;max-width:900px;margin:0 auto;padding:16px 12px 30px}
.events-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.events-title{font-size:24px;font-weight:800;letter-spacing:-.6px}
.sequence-dots{display:flex;align-items:center;gap:5px;min-height:20px}
.sequence-dot{width:5px;height:5px;border-radius:50%;background:#c7c7c7;transition:transform .25s ease,background .25s ease,opacity .25s ease}
.sequence-dot.active{background:#151515;transform:scale(1.35)}
.events-container{width:100%;display:flex;flex-direction:column;gap:16px}
.event-card{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;border-radius:24px;background:#f1f1f1;contain:layout paint style;transform:translateZ(0);-webkit-transform:translateZ(0)}
.event-media{position:absolute;inset:0;overflow:hidden;background:#ededed}
.event-media img,.event-media video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;opacity:0;transition:opacity .22s ease;background:#ededed}
.event-media.ready img,.event-media.ready video{opacity:1}
.skeleton{position:absolute;inset:0;z-index:3;background:linear-gradient(105deg,#ededed 20%,#f8f8f8 38%,#ededed 55%);background-size:250% 100%;animation:skeletonShimmer 1.15s linear infinite}
.skeleton.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}
@keyframes skeletonShimmer{from{background-position:200% 0}to{background-position:-50% 0}}
.media-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;font-size:13px;background:#ededed}
.event-content{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:70px 18px 18px;color:#fff;background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.08) 25%,rgba(0,0,0,.78) 100%)}
.event-name{font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.35px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-description{margin-top:7px;font-size:13px;line-height:1.4;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.event-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:11px;opacity:.86}
.event-badge{position:absolute;top:13px;left:13px;z-index:5;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.58);color:#fff;font-size:11px;font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.event-action{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;min-height:38px;padding:0 15px;border-radius:12px;background:#fff;color:#111;text-decoration:none;font-size:12px;font-weight:750}
.event-action:active{transform:scale(.97)}
.events-state{width:100%;padding:45px 15px;text-align:center;color:#888;font-size:13px}
@media(max-width:600px){.events-section{padding:14px 10px 28px}.event-card{border-radius:21px}.event-name{font-size:20px}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}.sequence-dot,.event-media img,.event-media video{transition:none}}
</style>
</head>
<body>
<section class="events-section">
  <header class="events-header">
    <h1 class="events-title">Events</h1>
    <div id="sequenceDots" class="sequence-dots" aria-hidden="true"></div>
  </header>
  <div id="eventsContainer" class="events-container"></div>
</section>
<script>
const EVENTS_API = "https://script.google.com/macros/s/AKfycbzx0u4TmwyDUtzLA1SU8Ektg8IObAVJ_yg5aYuGmFU9E1kgW_OeR88Dx1jz74KUZkXRPA/exec";
const container = document.getElementById('eventsContainer');
const dots = document.getElementById('sequenceDots');
const MAX_DOTS = 7;
const AUTO_SCROLL_MS = 5000;
const CACHE_KEY = 'nova_events_fast_v3';
const CACHE_TIME = 5 * 60 * 1000;
function isObject(v){return v!==null && typeof v==='object' && !Array.isArray(v)}
function text(v){if(v===null||v===undefined) return ''; return String(v).trim()}
function escapeHTML(v){return text(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function findValue(obj,names){if(!isObject(obj)) return ''; const wanted = names.map(x=>x.toLowerCase()); for(const key of Object.keys(obj)){ if(wanted.includes(key.toLowerCase())){ const value = obj[key]; if(typeof value==='string' || typeof value==='number' || typeof value==='boolean'){ return text(value); } } } return '' }
function findMediaURL(value,depth=0){ if(depth>8) return ''; if(typeof value==='string'){ const url=value.trim(); if(/^https?:\/\//i.test(url)) return url; return '' } if(!isObject(value) && !Array.isArray(value)) return ''; const priorityKeys=["url","src","image","imageUrl","imageURL","video","videoUrl","videoURL","media","mediaUrl","mediaURL","thumbnail","poster","photo","file","link","href"]; if(isObject(value)){ for(const key of priorityKeys){ if(value[key]!==undefined){ const result = findMediaURL(value[key],depth+1); if(result) return result; } } } const values = Array.isArray(value)? value : Object.values(value); for(const item of values){ const result = findMediaURL(item,depth+1); if(result) return result; } return '' }
function mediaType(url,raw){ const type = (findValue(raw,['mediaType','mime','format'])||'').toLowerCase(); if(type.includes('video')) return 'video'; if(type.includes('image')) return 'image'; const source = text(url).toLowerCase(); if(/\.(mp4|webm|m4v|mov|ogv)(\?|#|$)/i.test(source)) return 'video'; return 'image'}
function extractEvents(data){ if(Array.isArray(data)) return data; if(!isObject(data)) return []; const containers=["events","event","results","items","records","list","data","content"]; for(const key of containers){ const value = data[key]; if(Array.isArray(value)) return value; } const found=[]; const seen=new Set(); function walk(value,depth=0){ if(depth>10) return; if(Array.isArray(value)){ for(const item of value) walk(item,depth+1); return; } if(!isObject(value)) return; if(isLikelyEvent(value)){ try{ const fingerprint = JSON.stringify(value); if(!seen.has(fingerprint)){ seen.add(fingerprint); found.push(value); } }catch(e){} } for(const child of Object.values(value)){ if(isObject(child) || Array.isArray(child)){ walk(child,depth+1); } } } walk(data); return found }
function isLikelyEvent(object){ if(!isObject(object)) return false; const keys = Object.keys(object).map(k=>k.toLowerCase()); let score=0; const signals=["event","eventid","eventname","title","name","description","date","time","location","venue","media","image","video"]; for(const signal of signals){ if(keys.some(key=>key.includes(signal))) score++; } return score>=2 }
function normalizeEvent(raw){ if(!isObject(raw)) return null; const content = isObject(raw.content)? raw.content : {}; const media = isObject(raw.media)? raw.media : {}; const title = findValue(raw,['eventName','title','name']) || findValue(content,['eventName','title','name']); const description = findValue(raw,['description','desc','details']) || findValue(content,['description','desc','details']); const when = findValue(raw,['date','time','when']) || findValue(content,['date','time','when']); const location = findValue(raw,['location','venue','place']) || findValue(content,['location','venue','place']); const badge = findValue(raw,['badge','tag','category']) || findValue(content,['badge','tag','category']); const mediaURL = findMediaURL(raw) || findMediaURL(content) || findMediaURL(media); const type = mediaURL ? mediaType(mediaURL, raw) : null; const actionURL = findValue(raw,['url','link','href']) || findValue(content,['url','link','href']) || (typeof raw === 'string' && /^https?:\/\//.test(raw)? raw : ''); return {title,description,when,location,badge,mediaURL,type,actionURL,raw} }
function renderEvents(list){ container.innerHTML=''; dots.innerHTML=''; if(!list || list.length===0){ container.innerHTML='<div class="events-state">No events found.</div>'; return } for(const [i,raw] of list.entries()){ const item = normalizeEvent(raw); if(!item) continue; const card = document.createElement('article'); card.className='event-card'; // media
 const mediaWrap = document.createElement('div'); mediaWrap.className='event-media'; const skeleton = document.createElement('div'); skeleton.className='skeleton'; mediaWrap.appendChild(skeleton);
 if(item.mediaURL){ if(item.type==='video'){ const v = document.createElement('video'); v.src = item.mediaURL; v.autoplay = false; v.muted = true; v.loop = true; v.playsInline = true; v.addEventListener('loadeddata',()=>{ mediaWrap.classList.add('ready'); skeleton.classList.add('done'); }); mediaWrap.appendChild(v); } else { const img = document.createElement('img'); img.src = item.mediaURL; img.alt = escapeHTML(item.title||'Event image'); img.addEventListener('load',()=>{ mediaWrap.classList.add('ready'); skeleton.classList.add('done'); }); mediaWrap.appendChild(img); } } else { const fallback = document.createElement('div'); fallback.className='media-fallback'; fallback.textContent='No media'; mediaWrap.appendChild(fallback); skeleton.classList.add('done'); }
 card.appendChild(mediaWrap);
 // badge
 if(item.badge){ const b = document.createElement('div'); b.className='event-badge'; b.textContent = item.badge; card.appendChild(b); }
 // content
 const content = document.createElement('div'); content.className='event-content'; const name = document.createElement('div'); name.className='event-name'; name.textContent = item.title || 'Untitled Event'; content.appendChild(name); if(item.description){ const desc = document.createElement('div'); desc.className='event-description'; desc.textContent = item.description; content.appendChild(desc); }
 const meta = document.createElement('div'); meta.className='event-meta'; if(item.when){ const m = document.createElement('div'); m.textContent = item.when; meta.appendChild(m); } if(item.location){ const m2 = document.createElement('div'); m2.textContent = item.location; meta.appendChild(m2); } content.appendChild(meta);
 if(item.actionURL){ const a = document.createElement('a'); a.className='event-action'; a.href = item.actionURL; a.target='_blank'; a.rel='noopener noreferrer'; a.textContent = 'View'; content.appendChild(a); }
 card.appendChild(content);
 container.appendChild(card);
 // dots
 const dot = document.createElement('div'); dot.className='sequence-dot'; if(i===0) dot.classList.add('active'); dots.appendChild(dot);
 }
 setupAutoScroll(); }
let autoTimer = null;
function setupAutoScroll(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null } const cards = document.querySelectorAll('.event-card'); if(cards.length<=1) return; let index=0; autoTimer = setInterval(()=>{ const prev = dots.querySelector('.sequence-dot.active'); if(prev) prev.classList.remove('active'); index = (index+1) % cards.length; const nextDot = dots.children[index]; if(nextDot) nextDot.classList.add('active'); cards[index].scrollIntoView({behavior:'smooth',block:'center'}); }, AUTO_SCROLL_MS); }
async function fetchEvents(){ try{ const cached = localStorage.getItem(CACHE_KEY); if(cached){ try{ const parsed = JSON.parse(cached); if(Date.now() - parsed.t < CACHE_TIME && parsed.list){ renderEvents(parsed.list); return; } }catch(e){} }
 const res = await fetch(EVENTS_API); if(!res.ok) throw new Error('Network response not ok'); const data = await res.json(); const list = extractEvents(data).map(x=>normalizeEvent(x)? x : x); // keep raw objects for normalize later
 // store
 try{ localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(),list})); }catch(e){}
 renderEvents(list);
 }catch(err){ console.error(err); container.innerHTML='<div class="events-state">Unable to load events.</div>'; }
}
fetchEvents();
</script>
</body>
</html>
