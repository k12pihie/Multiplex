<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>Events</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #ffffff;
    --surface: #f7f7f8;
    --text: #151515;
    --muted: #777;
    --border: rgba(0,0,0,.08);
    --accent: #7c3aed;
    --radius: 22px;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
}

button,
a {
    -webkit-tap-highlight-color: transparent;
}

.app {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 18px 14px 40px;
}

/* =========================
   SECTION HEADER
========================= */

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
}

.section-title {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.6px;
}

.section-dots {
    font-size: 18px;
    letter-spacing: 3px;
    color: #aaa;
    user-select: none;
}

/* =========================
   EVENT GRID
========================= */

.events-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
}

/* =========================
   EVENT CARD
========================= */

.event-card {
    position: relative;
    overflow: hidden;

    background: var(--surface);
    border: 1px solid var(--border);

    border-radius: var(--radius);

    contain: content;

    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.event-card:active {
    transform: scale(.985);
}

.event-media {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;

    overflow: hidden;
    background: #ececef;
}

.event-media img,
.event-media video {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;

    border: 0;

    opacity: 0;

    transition: opacity .25s ease;
}

.event-media.loaded img,
.event-media.loaded video {
    opacity: 1;
}

/* =========================
   SHIMMER
========================= */

.shimmer {
    position: absolute;
    inset: 0;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            #eeeeef 0%,
            #f8f8f9 45%,
            #eeeeef 90%
        );

    background-size: 220% 100%;

    animation: shimmer 1.25s linear infinite;

    z-index: 2;
}

@keyframes shimmer {
    0% {
        background-position: 200% 0;
    }

    100% {
        background-position: -20% 0;
    }
}

.shimmer.hide {
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
}

/* =========================
   OVERLAY
========================= */

.event-overlay {
    position: absolute;
    inset: auto 0 0 0;

    padding: 45px 12px 12px;

    color: white;

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.78)
        );

    z-index: 3;
}

.event-overlay h2 {
    font-size: 16px;
    line-height: 1.2;
    font-weight: 750;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.event-overlay p {
    margin-top: 4px;

    font-size: 11px;

    opacity: .85;

    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

/* =========================
   BADGE
========================= */

.event-badge {
    position: absolute;

    top: 9px;
    left: 9px;

    z-index: 5;

    padding: 5px 8px;

    border-radius: 999px;

    background: rgba(0,0,0,.65);
    color: white;

    font-size: 10px;
    font-weight: 700;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

/* =========================
   CONTENT
========================= */

.event-content {
    padding: 11px 12px 13px;
}

.event-content-title {
    font-size: 15px;
    line-height: 1.25;
    font-weight: 750;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.event-description {
    margin-top: 5px;

    color: var(--muted);

    font-size: 11px;
    line-height: 1.4;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;

    overflow: hidden;
}

.event-meta {
    display: flex;
    flex-wrap: wrap;

    gap: 5px;

    margin-top: 9px;

    color: var(--muted);

    font-size: 10px;
}

.meta-item {
    white-space: nowrap;
}

/* =========================
   ACTION
========================= */

.event-action {
    display: inline-flex;

    width: 100%;

    margin-top: 10px;

    justify-content: center;
    align-items: center;

    min-height: 36px;

    border-radius: 12px;

    background: var(--text);
    color: white;

    text-decoration: none;

    font-size: 12px;
    font-weight: 700;
}

/* =========================
   EMPTY / ERROR
========================= */

.state {
    grid-column: 1 / -1;

    padding: 50px 20px;

    text-align: center;

    color: var(--muted);
}

.state h2 {
    color: var(--text);

    font-size: 18px;

    margin-bottom: 5px;
}

.state p {
    font-size: 13px;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .app {
        padding: 28px 24px 50px;
    }

    .section-title {
        font-size: 30px;
    }

    .events-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 18px;
    }

    .event-overlay h2 {
        font-size: 18px;
    }
}

@media (min-width: 1050px) {

    .events-grid {
        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }
}

/* =========================
   REDUCED MOTION
========================= */

@media (prefers-reduced-motion: reduce) {

    .shimmer {
        animation: none;
    }

    .event-card {
        transition: none;
    }
}
</style>
</head>

<body>

<main class="app">

    <header class="section-header">
        <h1 class="section-title">Events</h1>
        <div class="section-dots">•••</div>
    </header>

    <section
        id="events"
        class="events-grid"
        aria-label="Events">
    </section>

</main>

<script>
"use strict";

/* =========================================================
   API
========================================================= */

const EVENT_API =
"https://script.google.com/macros/s/AKfycbzx0u4TmwyDUtzLA1SU8Ektg8IObAVJ_yg5aYuGmFU9E1kgW_OeR88Dx1jz74KUZkXRPA/exec";

const eventsContainer =
    document.getElementById("events");


/* =========================================================
   CACHE
========================================================= */

const CACHE_KEY = "nova_events_cache_v2";

const CACHE_TIME =
    5 * 60 * 1000;


/* =========================================================
   HELPERS
========================================================= */

function isObject(value) {
    return value !== null &&
           typeof value === "object" &&
           !Array.isArray(value);
}

function safeString(value, fallback = "") {

    if (
        value === null ||
        value === undefined
    ) {
        return fallback;
    }

    return String(value);
}

function escapeHTML(value) {

    return safeString(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   SHIMMER SKELETONS
========================================================= */

function showSkeletons(count = 4) {

    const fragment =
        document.createDocumentFragment();

    for (let i = 0; i < count; i++) {

        const card =
            document.createElement("article");

        card.className = "event-card";

        card.innerHTML = `
            <div class="event-media">
                <div class="shimmer"></div>
            </div>

            <div class="event-content">

                <div
                    class="shimmer"
                    style="
                        position:relative;
                        height:14px;
                        border-radius:7px;
                        margin-bottom:8px;
                    ">
                </div>

                <div
                    class="shimmer"
                    style="
                        position:relative;
                        height:10px;
                        width:70%;
                        border-radius:6px;
                    ">
                </div>

            </div>
        `;

        fragment.appendChild(card);
    }

    eventsContainer.appendChild(fragment);
}


/* =========================================================
   MEDIA DETECTION
========================================================= */

function detectMediaType(url, type) {

    if (type) {

        const t =
            safeString(type).toLowerCase();

        if (t.includes("video"))
            return "video";

        if (t.includes("image"))
            return "image";
    }

    const source =
        safeString(url).toLowerCase();

    if (
        source.includes(".mp4") ||
        source.includes(".webm") ||
        source.includes(".mov") ||
        source.includes(".m4v")
    ) {
        return "video";
    }

    return "image";
}


/* =========================================================
   NORMALIZE EVENT
========================================================= */

function normalizeEvent(raw) {

    if (!isObject(raw))
        return null;

    const content =
        isObject(raw.content)
            ? raw.content
            : isObject(raw.details)
                ? raw.details
                : isObject(raw.info)
                    ? raw.info
                    : {};

    const media =
        isObject(raw.media)
            ? raw.media
            : {};

    const image =
        raw.image ||
        raw.imageUrl ||
        raw.imageURL ||
        raw.photo ||
        media.url ||
        media.src ||
        media.imageUrl ||
        "";

    const video =
        raw.video ||
        raw.videoUrl ||
        raw.videoURL ||
        media.videoUrl ||
        "";

    const mediaURL =
        video ||
        image ||
        raw.poster ||
        raw.thumbnail ||
        "";

    const mediaType =
        detectMediaType(
            mediaURL,
            media.type ||
            raw.mediaType ||
            raw.type
        );

    const title =
        content.title ||
        raw.title ||
        raw.name ||
        raw.eventName ||
        "Untitled Event";

    const description =
        content.description ||
        raw.description ||
        raw.desc ||
        "";

    return {

        id:
            raw.id ||
            raw.eventId ||
            raw.eventID ||
            crypto.randomUUID(),

        title: safeString(title),

        description:
            safeString(description),

        date:
            safeString(
                raw.date ||
                content.date
            ),

        time:
            safeString(
                raw.time ||
                content.time
            ),

        location:
            safeString(
                raw.location ||
                raw.venue ||
                content.location
            ),

        category:
            safeString(
                raw.category ||
                content.category
            ),

        badge:
            raw.badge ||
            content.badge ||
            "",

        media: {

            url: mediaURL,

            type: mediaType,

            poster:
                raw.poster ||
                media.poster ||
                "",

            alt:
                media.alt ||
                title
        },

        action:
            raw.action ||
            content.action ||
            raw.button ||
            null,

        enabled:
            raw.enabled !== false &&
            raw.active !== false
    };
}


/* =========================================================
   MEDIA
========================================================= */

function renderMedia(event) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "event-media";

    const shimmer =
        document.createElement("div");

    shimmer.className =
        "shimmer";

    wrapper.appendChild(shimmer);

    const url =
        safeString(event.media.url);

    if (!url) {

        shimmer.remove();

        wrapper.innerHTML += `
            <div
                style="
                    position:absolute;
                    inset:0;
                    display:grid;
                    place-items:center;
                    color:#888;
                    font-size:11px;
                ">
                No media
            </div>
        `;

        return wrapper;
    }


    if (
        event.media.type === "video"
    ) {

        const video =
            document.createElement("video");

        video.src = url;

        video.preload = "metadata";

        video.playsInline = true;

        video.muted = true;

        video.controls = false;

        video.loop = false;

        if (event.media.poster)
            video.poster =
                event.media.poster;

        video.addEventListener(
            "loadeddata",
            () => {

                wrapper.classList.add(
                    "loaded"
                );

                shimmer.classList.add(
                    "hide"
                );

            },
            { once: true }
        );

        video.addEventListener(
            "error",
            () => {

                shimmer.classList.add(
                    "hide"
                );

                video.style.display =
                    "none";

            },
            { once: true }
        );

        wrapper.appendChild(video);

    } else {

        const img =
            document.createElement("img");

        img.src = url;

        img.alt =
            safeString(
                event.media.alt,
                event.title
            );

        img.loading = "lazy";

        img.decoding = "async";

        img.fetchPriority =
            "low";

        img.addEventListener(
            "load",
            () => {

                wrapper.classList.add(
                    "loaded"
                );

                shimmer.classList.add(
                    "hide"
                );

            },
            { once: true }
        );

        img.addEventListener(
            "error",
            () => {

                shimmer.classList.add(
                    "hide"
                );

            },
            { once: true }
        );

        wrapper.appendChild(img);
    }

    return wrapper;
}


/* =========================================================
   OVERLAY
========================================================= */

function renderOverlay(event) {

    if (
        !event.title &&
        !event.description
    ) {
        return null;
    }

    const overlay =
        document.createElement("div");

    overlay.className =
        "event-overlay";

    overlay.innerHTML = `

        <h2>
            ${escapeHTML(event.title)}
        </h2>

        ${
            event.description
                ? `
                <p>
                    ${escapeHTML(
                        event.description
                    )}
                </p>
                `
                : ""
        }

    `;

    return overlay;
}


/* =========================================================
   EVENT CARD
========================================================= */

function createEventCard(event) {

    if (!event ||
        event.enabled === false)
        return null;

    const card =
        document.createElement("article");

    card.className =
        "event-card";

    card.dataset.eventId =
        safeString(event.id);

    /* MEDIA */

    const media =
        renderMedia(event);

    card.appendChild(media);


    /* OVERLAY */

    const overlay =
        renderOverlay(event);

    if (overlay)
        media.appendChild(overlay);


    /* BADGE */

    if (event.badge) {

        const badge =
            document.createElement("div");

        badge.className =
            "event-badge";

        badge.textContent =
            typeof event.badge === "object"
                ? safeString(
                    event.badge.text
                )
                : safeString(
                    event.badge
                );

        media.appendChild(badge);
    }


    /* CONTENT */

    const content =
        document.createElement("div");

    content.className =
        "event-content";

    content.innerHTML = `

        <div class="event-content-title">
            ${escapeHTML(event.title)}
        </div>

        ${
            event.description
                ? `
                <div class="event-description">
                    ${escapeHTML(
                        event.description
                    )}
                </div>
                `
                : ""
        }

        <div class="event-meta">

            ${
                event.date
                    ? `
                    <span class="meta-item">
                        ${escapeHTML(
                            event.date
                        )}
                    </span>
                    `
                    : ""
            }

            ${
                event.time
                    ? `
                    <span class="meta-item">
                        • ${escapeHTML(
                            event.time
                        )}
                    </span>
                    `
                    : ""
            }

            ${
                event.location
                    ? `
                    <span class="meta-item">
                        • ${escapeHTML(
                            event.location
                        )}
                    </span>
                    `
                    : ""
            }

        </div>

    `;


    /* ACTION */

    if (
        event.action &&
        isObject(event.action) &&
        event.action.url
    ) {

        const link =
            document.createElement("a");

        link.className =
            "event-action";

        link.href =
            safeString(
                event.action.url
            );

        link.textContent =
            safeString(
                event.action.label,
                "View Event"
            );

        link.target = "_blank";

        link.rel =
            "noopener noreferrer";

        content.appendChild(link);
    }


    card.appendChild(content);

    return card;
}


/* =========================================================
   FIND EVENTS FROM ANY JSON STRUCTURE
========================================================= */

function extractEvents(data) {

    if (Array.isArray(data))
        return data;

    if (!isObject(data))
        return [];

    const directKeys = [
        "events",
        "data",
        "results",
        "items",
        "records"
    ];

    for (const key of directKeys) {

        if (Array.isArray(data[key]))
            return data[key];
    }


    const found = [];

    function walk(value) {

        if (Array.isArray(value)) {

            for (const item of value
