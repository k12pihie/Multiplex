<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Events</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    background:#fff;
    color:#171717;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body{
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
}


/* =========================================================
   EVENTS SECTION
========================================================= */

.events-section{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:16px 12px 30px;
}


/* =========================================================
   HEADER
========================================================= */

.events-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.events-title{
    font-size:24px;
    font-weight:800;
    letter-spacing:-.6px;
}

.sequence-dots{
    display:flex;
    align-items:center;
    gap:5px;
    min-height:20px;
}

.sequence-dot{
    width:5px;
    height:5px;
    border-radius:50%;
    background:#c7c7c7;

    transition:
        transform .25s ease,
        background .25s ease,
        opacity .25s ease;
}

.sequence-dot.active{
    background:#151515;
    transform:scale(1.35);
}


/* =========================================================
   EVENTS CONTAINER
========================================================= */

.events-container{
    width:100%;

    display:flex;
    flex-direction:column;

    gap:16px;
}


/* =========================================================
   EVENT CARD
========================================================= */

.event-card{
    position:relative;

    width:100%;

    aspect-ratio:4 / 5;

    overflow:hidden;

    border-radius:24px;

    background:#f1f1f1;

    contain:layout paint style;

    transform:translateZ(0);
    -webkit-transform:translateZ(0);
}


/* =========================================================
   MEDIA
========================================================= */

.event-media{
    position:absolute;

    inset:0;

    overflow:hidden;

    background:#ededed;
}

.event-media img,
.event-media video{
    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    opacity:0;

    transition:opacity .22s ease;

    background:#ededed;
}

.event-media.ready img,
.event-media.ready video{
    opacity:1;
}


/* =========================================================
   SKELETON SHIMMER
========================================================= */

.skeleton{
    position:absolute;

    inset:0;

    z-index:3;

    background:
        linear-gradient(
            105deg,
            #ededed 20%,
            #f8f8f8 38%,
            #ededed 55%
        );

    background-size:250% 100%;

    animation:
        skeletonShimmer 1.15s linear infinite;
}

.skeleton.done{
    opacity:0;
    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .2s ease,
        visibility .2s ease;
}

@keyframes skeletonShimmer{

    from{
        background-position:200% 0;
    }

    to{
        background-position:-50% 0;
    }
}


/* =========================================================
   MEDIA FALLBACK
========================================================= */

.media-fallback{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#999;

    font-size:13px;

    background:#ededed;
}


/* =========================================================
   EVENT CONTENT
========================================================= */

.event-content{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:4;

    padding:70px 18px 18px;

    color:#fff;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(0,0,0,.08) 25%,
            rgba(0,0,0,.78) 100%
        );
}

.event-name{
    font-size:22px;

    line-height:1.15;

    font-weight:800;

    letter-spacing:-.35px;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.event-description{
    margin-top:7px;

    font-size:13px;

    line-height:1.4;

    opacity:.9;

    display:-webkit-box;

    -webkit-line-clamp:2;

    -webkit-box-orient:vertical;

    overflow:hidden;
}

.event-meta{
    display:flex;

    flex-wrap:wrap;

    gap:6px;

    margin-top:9px;

    font-size:11px;

    opacity:.86;
}


/* =========================================================
   BADGE
========================================================= */

.event-badge{
    position:absolute;

    top:13px;
    left:13px;

    z-index:5;

    padding:6px 10px;

    border-radius:999px;

    background:rgba(0,0,0,.58);

    color:#fff;

    font-size:11px;

    font-weight:700;

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);
}


/* =========================================================
   ACTION BUTTON
========================================================= */

.event-action{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    margin-top:12px;

    min-height:38px;

    padding:0 15px;

    border-radius:12px;

    background:#fff;

    color:#111;

    text-decoration:none;

    font-size:12px;

    font-weight:750;
}

.event-action:active{
    transform:scale(.97);
}


/* =========================================================
   EMPTY / ERROR STATE
========================================================= */

.events-state{
    width:100%;

    padding:45px 15px;

    text-align:center;

    color:#888;

    font-size:13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .events-section{
        padding:
            14px
            10px
            28px;
    }

    .event-card{
        border-radius:21px;
    }

    .event-name{
        font-size:20px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    .skeleton{
        animation:none;
    }

    .sequence-dot,
    .event-media img,
    .event-media video{
        transition:none;
    }
}

</style>
</head>

<script>


/* =========================================================

========================================================= */

const EVENTS_API =
"https://script.google.com/macros/s/AKfycbzx0u4TmwyDUtzLA1SU8Ektg8IObAVJ_yg5aYuGmFU9E1kgW_OeR88Dx1jz74KUZkXRPA/exec";

/* =========================================================

const MAX_DOTS = 7;

const AUTO_SCROLL_MS =
    5000;

const CACHE_TIME =

/* =========================================================
   BASIC HELPERS
========================================================= */

function isObject(value){

    return value !== null &&
           typeof value === "object" &&
           !Array.isArray(value);
}


function text(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value).trim();
}


function escapeHTML(value){

    return text(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   FIND VALUE
========================================================= */

function findValue(
    object,
    names
){

    if(!isObject(object))
        return "";

    const wanted =
        names.map(
            x => x.toLowerCase()
        );


    for(
        const key of Object.keys(object)
    ){

        if(
            wanted.includes(
                key.toLowerCase()
            )
        ){

            const value =
                object[key];

            if(
                typeof value === "string" ||
                typeof value === "number" ||
                typeof value === "boolean"
            ){

                return text(value);
            }
        }
    }


    return "";
}


/* =========================================================
   DEEP MEDIA URL FINDER
========================================================= */

function findMediaURL(
    value,
    depth = 0
){

    if(depth > 8)
        return "";


    if(typeof value === "string"){

        const url =
            value.trim();

        if(
            /^https?:\/\//i.test(url)
        ){

            return url;
        }

        return "";
    }


    if(
        !isObject(value) &&
        !Array.isArray(value)
    ){

        return "";
    }


    const priorityKeys = [

        "url",
        "src",
        "image",
        "imageUrl",
        "imageURL",
        "video",
        "videoUrl",
        "videoURL",
        "media",
        "mediaUrl",
        "mediaURL",
        "thumbnail",
        "poster",
        "photo",
        "file",
        "link",
        "href"

    ];


    if(isObject(value)){

        for(
            const key of priorityKeys
        ){

            if(
                value[key] !== undefined
            ){

                const result =
                    findMediaURL(
                        value[key],
                        depth + 1
                    );

                if(result)
                    return result;
            }
        }
    }


    const values =
        Array.isArray(value)
            ? value
            : Object.values(value);


    for(
        const item of values
    ){

        const result =
            findMediaURL(
                item,
                depth + 1
            );

        if(result)
            return result;
    }


    return "";
}


/* =========================================================
   MEDIA TYPE
========================================================= */

function mediaType(
    url,
    raw
){

    const type =
        findValue(
            raw,
            [
                "mediaType",
                "mime",
                "format"
            ]
        ).toLowerCase();


    if(
        type.includes("video")
    ){

        return "video";
    }


    if(
        type.includes("image")
    ){

        return "image";
    }


    const source =
        text(url).toLowerCase();


    if(
        /\.(mp4|webm|m4v|mov|ogv)(\?|#|$)/i
            .test(source)
    ){

        return "video";
    }


    return "image";
}


/* =========================================================
   EVENT DETECTION
========================================================= */

function isLikelyEvent(
    object
){

    if(!isObject(object))
        return false;


    const keys =
        Object.keys(object)
            .map(
                key =>
                    key.toLowerCase()
            );


    let score = 0;


    const signals = [

        "event",
        "eventid",
        "eventname",
        "title",
        "name",
        "description",
        "date",
        "time",
        "location",
        "venue",
        "media",
        "image",
        "video"

    ];


    for(
        const signal of signals
    ){

        if(
            keys.some(
                key =>
                    key.includes(signal)
            )
        ){

            score++;
        }
    }


    return score >= 2;
}


/* =========================================================
   DEEP EVENT EXTRACTION
========================================================= */

function extractEvents(
    data
){

    if(Array.isArray(data))
        return data;


    if(!isObject(data))
        return [];


    const containers = [

        "events",
        "event",
        "results",
        "items",
        "records",
        "list",
        "data",
        "content"

    ];


    for(
        const key of containers
    ){

        const value =
            data[key];


        if(Array.isArray(value))
            return value;
    }


    const found = [];

    const seen =
        new Set();


    function walk(
        value,
        depth = 0
    ){

        if(depth > 10)
            return;


        if(Array.isArray(value)){

            for(
                const item of value
            ){

                walk(
                    item,
                    depth + 1
                );
            }

            return;
        }


        if(!isObject(value))
            return;


        if(isLikelyEvent(value)){

            try{

                const fingerprint =
                    JSON.stringify(value);


                if(
                    !seen.has(
                        fingerprint
                    )
                ){

                    seen.add(
                        fingerprint
                    );

                    found.push(value);
                }

            }catch{}
        }


        for(
            const child
            of Object.values(value)
        ){

            if(
                isObject(child) ||
                Array.isArray(child)
            ){

                walk(
                    child,
                    depth + 1
                );
            }
        }
    }


    walk(data);

    return found;
}


/* =========================================================
   NORMALIZE EVENT
========================================================= */

function normalizeEvent(
    raw
){

    if(!isObject(raw))
        return null;


    const content =
        isObject(raw.content)
            ? raw.content
            : {};


    const media =
        isObject(raw.media)
            ? raw.media
            : {};


    const title =
        findValue(
            raw,
            [
                "eventName",
                "title",
                "name"
            ]
        ) ||
        findValue(
            content,
            [
                "eventName",
                "title",
                "name"
            ]
        );


    const description =
        findValue(
            raw,
            [
                "description",
                "desc",
                "details"
            ]
        ) ||
        findValue(
            content,
            [
                "description",
                "desc",
                "details"
            ]
        );


    const date =
        findValue(
            raw,
            [
                "date",
                "eventDate"
            ]
        ) ||
        findValue(
            content,
            [
                "date",
                "eventDate"
            ]
        );


    const time =
        findValue(
            raw,
            [
                "time",
                "eventTime"
            ]
        ) ||
        findValue(
            content,
            [
                "time",
                "eventTime"
            ]
        );


    const location =
        findValue(
            raw,
            [
                "location",
                "venue",
                "place"
            ]
        ) ||
        findValue(
            content,
            [
                "location",
                "venue",
                "place"
            ]
        );


    const badge =
        findValue(
            raw,
            [
                "badge",
                "label"
            ]
        ) ||
        findValue(
            content,
            [
                "badge",
                "label"
            ]
        );


    const mediaURL =
        findMediaURL(media) ||
        findMediaURL(raw);


    const type =
        mediaType(
            mediaURL,
            raw
        );


    let actionURL =
        findValue(
            raw,
            [
                "actionUrl",
                "actionURL",
                "href"
            ]
        );


    if(
        !actionURL &&
        isObject(raw.action)
    ){

        actionURL =
            findValue(
                raw.action,
                [
                    "url",
                    "href",
                    "link"
                ]
            );
    }


    const actionLabel =
        (
            isObject(raw.action)
                ? findValue(
                    raw.action,
                    [
                        "label",
                        "text",
                        "title"
                    ]
                )
                : ""
        ) ||
        "View Event";


    let enabled = true;


    const enabledValue =
        findValue(
            raw,
            [
                "enabled",
                "active",
                "visible"
            ]
        ).toLowerCase();


    if(
        enabledValue === "false" ||
        enabledValue === "0" ||
        enabledValue === "no"
    ){

        enabled = false;
    }


    return {

        id:
            findValue(
                raw,
                [
                    "id",
                    "eventId",
                    "eventID"
                ]
            ),

        title:
            title || "Event",

        description,

        date,

        time,

        location,

        badge,

        mediaURL,

        mediaType:type,

        actionURL,

        actionLabel,

        enabled,

        raw
    };
}


/* =========================================================
   SKELETON
========================================================= */

function createSkeleton(){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "event-card";


    card.innerHTML = `

        <div class="event-media">

            <div class="skeleton"></div>

        </div>

    `;


    return card;
}


function showSkeletons(){

    container.innerHTML = "";

    const fragment =
        document.createDocumentFragment();


    for(
        let i = 0;
        i < 2;
        i++
    ){

        fragment.appendChild(
            createSkeleton()
        );
    }


    container.appendChild(
        fragment
    );
}


/* =========================================================
   MEDIA LOADING
========================================================= */

function attachMedia(
    wrapper,
    event
){

    const skeleton =
        wrapper.querySelector(
            ".skeleton"
        );


    if(!event.mediaURL){

        skeleton?.classList.add(
            "done"
        );


        wrapper.insertAdjacentHTML(
            "beforeend",
            `
            <div class="media-fallback">
                No media
            </div>
            `
        );


        return;
    }


    const url =
    event.mediaURL;


/* =====================================================
   VIDEO
===================================================== */

if(
    event.mediaType ===
    "video"
){

    const video =
        document.createElement(
            "video"
        );

    video.src =
        url;

    video.preload =
        "metadata";

    video.muted =
        true;

    video.playsInline =
        true;

    video.loop =
        true;

    video.controls =
        false;

    video.setAttribute(
        "playsinline",
        ""
    );

    video.setAttribute(
        "muted",
        ""
    );

    video.addEventListener(
        "loadeddata",
        () => {

            wrapper.classList.add(
                "ready"
            );

            skeleton?.classList.add(
                "done"
            );

            video.play().catch(
                () => {}
            );

        },
        {
            once:true
        }
    );

    video.addEventListener(
        "error",
        () => {

            skeleton?.classList.add(
                "done"
            );

            video.remove();

            wrapper.insertAdjacentHTML(
                "beforeend",
                `
                <div class="media-fallback">
                    Media unavailable
                </div>
                `
            );

        },
        {
            once:true
        }
    );

    wrapper.appendChild(
        video
    );

    return;
}


/* =====================================================

===================================================== */

const image =

    );

image.alt =
    event.title ||

image.loading =

image.decoding =

image.setAttribute(

image.addEventListener(

image.src =

/* =====================================================
   CREATE EVENT CARD
===================================================== */

function createCard(event){

    const card =
        document.createElement("article");

    card.className =
        "event-card";

    card.dataset.id =
        event.id;

    const media =
        document.createElement("div");

    media.className =
        "event-media";

    const skeleton =
        document.createElement("div");

    skeleton.className =
        "skeleton";

    media.appendChild(
        skeleton
    );

    attachMedia(
        media,
        event
    );

    /* =================================================
       BADGE
    ================================================= */

    if(event.badge){

        const badge =
            document.createElement("span");

        badge.className =
            "event-badge";

        badge.textContent =
            event.badge;

        media.appendChild(
            badge
        );

    }


    /* =================================================
       CONTENT
    ================================================= */

    const content =
        document.createElement("div");

    content.className =
        "event-content";


    const title =
        document.createElement("h2");

    title.className =
        "event-name";

    title.textContent =
        event.title;

    content.appendChild(
        title
    );


    if(event.description){

        const description =
            document.createElement("p");

        description.className =
            "event-description";

        description.textContent =
            event.description;

        content.appendChild(
            description
        );

    }


    /* =================================================
       META
    ================================================= */

    const meta =
        document.createElement("div");

    meta.className =
        "event-meta";


    if(event.date){

        const date =
            document.createElement("span");

        date.textContent =
            "📅 " + event.date;

        meta.appendChild(
            date
        );

    }


    if(event.time){

        const time =
            document.createElement("span");

        time.textContent =
            "⏰ " + event.time;

        meta.appendChild(
            time
        );

    }


    if(event.location){

        const location =
            document.createElement("span");

        location.textContent =
            "📍 " + event.location;

        meta.appendChild(
            location
        );

    }


    if(meta.children.length){

        content.appendChild(
            meta
        );

    }


    /* =================================================
       ACTION
    ================================================= */

    if(event.actionURL){

        const action =
            document.createElement("a");

        action.className =
            "event-action";

        action.href =
            event.actionURL;

        action.textContent =
            event.actionLabel ||
            "View Event";

        action.target =
            "_blank";

        action.rel =
            "noopener noreferrer";

        content.appendChild(
            action
        );

    }


    card.appendChild(
        media
    );

    card.appendChild(
        content
    );

    return card;
}


/* =====================================================
   CREATE SEQUENCE DOTS
===================================================== */

function createDots(count){

    dots.innerHTML = "";

    const visibleCount =
        Math.min(
            count,
            MAX_DOTS
        );

    for(
        let i = 0;
        i < visibleCount;
        i++
    ){

        const dot =
            document.createElement("span");

        dot.className =
            "sequence-dot";

        if(i === 0){

            dot.classList.add(
                "active"
            );

        }

        dots.appendChild(
            dot
        );

    }

}


/* =====================================================
   UPDATE SEQUENCE DOTS
===================================================== */

function updateDots(index){

    const allDots =
        dots.querySelectorAll(
            ".sequence-dot"
        );

    allDots.forEach(
        (dot, i) => {

            dot.classList.toggle(
                "active",
                i ===
                index %
                allDots.length
            );

        }
    );

}


/* =====================================================
   CACHE
===================================================== */

function saveCache(events){

    try{

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
                time: Date.now(),
                data: events
            })
        );

    }
    catch(error){

        console.warn(
            "Cache save failed:",
            error
        );

    }

}


function getCache(){

    try{

        const cached =
            localStorage.getItem(
                CACHE_KEY
            );

        if(!cached)
            return null;

        const parsed =
            JSON.parse(
                cached
            );

        if(
            !parsed ||
            !parsed.time ||
            !Array.isArray(
                parsed.data
            )
        ){

            return null;

        }

        if(
            Date.now() -
            parsed.time >
            CACHE_TIME
        ){

            return null;

        }

        return parsed.data;

    }
    catch(error){

        return null;

    }

}


/* =====================================================
   FETCH EVENTS
===================================================== */

async function fetchEvents(){

    const response =
        await fetch(
            EVENTS_API,
            {
                method: "GET",
                cache: "no-store"
            }
        );

    if(!response.ok){

        throw new Error(
            "HTTP " +
            response.status
        );

    }

    const data =
        await response.json();

    return extractEvents(
        data
    );

}


/* =====================================================
   RENDER EVENTS
===================================================== */

function renderEvents(rawEvents){

    const events =
        rawEvents
            .map(
                normalizeEvent
            )
            .filter(
                event =>
                    event.enabled !== false
            );

    container.innerHTML = "";

    if(!events.length){

        container.innerHTML =
            `
            <div class="media-fallback">
                No events available
            </div>
            `;

        dots.innerHTML = "";

        return;

    }

    events.forEach(
        event => {

            container.appendChild(
                createCard(
                    event
                )
            );

        }
    );

    createDots(
        events.length
    );

    currentIndex = 0;

    updateDots(
        currentIndex
    );

}


/* =====================================================
   LOAD EVENTS
===================================================== */

async function loadEvents(){

    const cached =
        getCache();

    if(cached){

        renderEvents(
            cached
        );

    }

    try{

        const fresh =
            await fetchEvents();

        if(
            Array.isArray(
                fresh
            )
        ){

            saveCache(
                fresh
            );

            renderEvents(
                fresh
            );

        }

    }
    catch(error){

        console.warn(
            "Events API failed:",
            error
        );

        if(!cached){

            container.innerHTML =
                `
                <div class="media-fallback">
                    Unable to load events
                </div>
                `;

        }

    }

      }
      /* =====================================================
   AUTO SCROLL
===================================================== */

let currentIndex = 0;

function setupAutoScroll(){

    setInterval(() => {

        const cards =
            container.querySelectorAll(
                ".event-card"
            );

        if(!cards.length)
            return;

        currentIndex =
            (currentIndex + 1) %
            cards.length;

        cards[currentIndex].scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        updateDots(
            currentIndex
        );

    }, AUTO_SCROLL_MS);

}


/* =====================================================
   TOUCH / SWIPE
===================================================== */

let touchStartX = 0;
let touchEndX = 0;

container.addEventListener(
    "touchstart",
    event => {

        touchStartX =
            event.changedTouches[0].screenX;

    },
    {
        passive: true
    }
);

container.addEventListener(
    "touchend",
    event => {

        touchEndX =
            event.changedTouches[0].screenX;

        const difference =
            touchStartX -
            touchEndX;

        if(
            Math.abs(difference) <
            50
        ){

            return;

        }

        const cards =
            container.querySelectorAll(
                ".event-card"
            );

        if(!cards.length)
            return;

        if(difference > 0){

            currentIndex =
                Math.min(
                    currentIndex + 1,
                    cards.length - 1
                );

        }
        else{

            currentIndex =
                Math.max(
                    currentIndex - 1,
                    0
                );

        }

        cards[currentIndex].scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        updateDots(
            currentIndex
        );

    },
    {
        passive: true
    }
);


/* =====================================================
   VISIBILITY REFRESH
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            loadEvents();

        }

    }
);


/* =====================================================
   INITIAL LOAD
===================================================== */

showSkeletons();

loadEvents();

setupAutoScroll();


/* =====================================================
   PERIODIC REFRESH
===================================================== */

setInterval(
    () => {

        if(
            document.visibilityState ===
            "visible"
        ){

            loadEvents();

        }

    },
    5 * 60 * 1000
);


/* =====================================================
   PUBLIC API
===================================================== */

window.NovaEvents = {

    refresh:
        loadEvents,

    extract:
        extractEvents,

    normalize:
        normalizeEvent

};

</script>
