<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f10">
<title>NovaStudio Events</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #151515;
    --muted: #777;
    --border: rgba(0,0,0,.08);
    --accent: #8b5cf6;
    --radius: 24px;
}

body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont,
                 "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 16px;
    backdrop-filter: blur(18px);
    background: rgba(247,247,248,.82);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -.4px;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
}

/* =========================
   MAIN
========================= */

.container {
    width: min(1100px, 100%);
    margin: auto;
    padding: 18px 14px 60px;
}

.events-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
}

/* =========================
   EVENT CARD
========================= */

.event-card {
    position: relative;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 10px 35px rgba(0,0,0,.06);
    transition: transform .25s ease, box-shadow .25s ease;
    isolation: isolate;
}

.event-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 50px rgba(0,0,0,.10);
}

/* =========================
   MEDIA
========================= */

.media-wrap {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: #e9e9ea;
}

.media-wrap.ratio-1-1 {
    aspect-ratio: 1 / 1;
}

.media-wrap.ratio-4-5 {
    aspect-ratio: 4 / 5;
}

.media-wrap.ratio-16-9 {
    aspect-ratio: 16 / 9;
}

.media-wrap.ratio-3-4 {
    aspect-ratio: 3 / 4;
}

.media-wrap.ratio-auto {
    aspect-ratio: auto;
}

.media-wrap img,
.media-wrap video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border: 0;
}

.media-wrap.contain img,
.media-wrap.contain video {
    object-fit: contain;
}

.media-wrap.fill img,
.media-wrap.fill video {
    object-fit: fill;
}

/* =========================
   SKELETON
========================= */

.skeleton {
    position: absolute;
    inset: 0;
    z-index: 5;
    background:
        linear-gradient(
            110deg,
            #eeeeee 8%,
            #f8f8f8 18%,
            #eeeeee 33%
        );
    background-size: 200% 100%;
    animation: shimmer 1.25s linear infinite;
}

@keyframes shimmer {
    to {
        background-position-x: -200%;
    }
}

.loaded .skeleton {
    display: none;
}

/* =========================
   OVERLAY
========================= */

.media-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
    pointer-events: none;
}

.media-overlay.gradient {
    background: linear-gradient(
        to top,
        rgba(0,0,0,.78),
        rgba(0,0,0,.28) 45%,
        transparent 75%
    );
}

.overlay-title {
    font-size: clamp(22px, 5vw, 34px);
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 7px;
}

.overlay-subtitle {
    font-size: 12px;
    letter-spacing: 1.2px;
    font-weight: 700;
    opacity: .9;
}

/* =========================
   BADGE
========================= */

.badge {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 10;
    padding: 7px 11px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
    backdrop-filter: blur(10px);
}

/* =========================
   CONTENT
========================= */

.event-content {
    padding: 18px;
}

.event-title {
    font-size: 20px;
    font-weight: 800;
    line-height: 1.15;
}

.event-description {
    margin-top: 8px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
}

.event-meta {
    display: grid;
    gap: 7px;
    margin-top: 15px;
}

.meta-item {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    font-size: 13px;
}

.meta-icon {
    width: 18px;
    flex: 0 0 18px;
    opacity: .75;
}

.meta-value {
    color: var(--text);
}

/* =========================
   CUSTOM FIELDS
========================= */

.custom-fields {
    margin-top: 14px;
    display: grid;
    gap: 7px;
}

.custom-field {
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 12px;
}

.custom-field strong {
    display: block;
    margin-bottom: 2px;
}

/* =========================
   ACTION
========================= */

.actions {
    margin-top: 17px;
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.action-btn {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    min-height: 42px;
    padding: 0 17px;
    border: 0;
    border-radius: 14px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 750;
    cursor: pointer;
    transition: transform .18s ease, opacity .18s ease;
}

.action-btn:hover {
    transform: translateY(-1px);
}

.action-btn:active {
    transform: scale(.97);
}

.primary {
    flex: 1;
}

.secondary {
    background: transparent !important;
    border: 1px solid var(--border);
}

/* =========================
   EMPTY / ERROR
========================= */

.state {
    text-align: center;
    padding: 70px 20px;
    color: var(--muted);
}

.state h2 {
    color: var(--text);
    margin-bottom: 7px;
}

/* =========================
   DARK MODE
========================= */

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0d0d0f;
        --card: #161619;
        --text: #f5f5f5;
        --muted: #9b9b9f;
        --border: rgba(255,255,255,.09);
    }

    .header {
        background: rgba(13,13,15,.82);
    }

    .media-wrap {
        background: #202024;
    }

    .skeleton {
        background:
            linear-gradient(
                110deg,
                #202024 8%,
                #2a2a2e 18%,
                #202024 33%
            );
        background-size: 200% 100%;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {
    .container {
        padding: 12px 10px 45px;
    }

    .events-grid {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .event-card {
        border-radius: 21px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">NovaStudio Events</div>

        <div class="status">
            <span class="status-dot"></span>
            Live
        </div>
    </div>
</header>

<main class="container">
    <section id="events" class="events-grid"></section>

    <div id="loadingState" class="state">
        <h2>Loading events</h2>
        <p>Preparing your event experience...</p>
    </div>
</main>

<script>

/* ============================================================
   SAFE HELPERS
   ============================================================ */

function isObject(value) {
    return value &&
        typeof value === "object" &&
        !Array.isArray(value);
}

function isArray(value) {
    return Array.isArray(value);
}

function safeString(value, fallback = "") {
    if (
        value === null ||
        value === undefined
    ) return fallback;

    if (
        typeof value === "object" ||
        typeof value === "function"
    ) return fallback;

    return String(value);
}

function escapeHTML(value) {
    return safeString(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   DEEP SEARCH ENGINE

   Finds events even when API structure changes.
   ============================================================ */

function deepCollectEvents(data) {

    const found = [];
    const visited = new WeakSet();

    function walk(node, path = []) {

        if (!node || typeof node !== "object")
            return;

        if (visited.has(node))
            return;

        visited.add(node);

        if (Array.isArray(node)) {

            for (let i = 0; i < node.length; i++) {
                walk(node[i], [...path, i]);
            }

            return;
        }

        /*
         * Event detection based on multiple possible fields.
         */

        const keys =
            Object.keys(node)
                .map(k => k.toLowerCase());

        const eventSignals = [
            "event",
            "eventid",
            "eventname",
            "title",
            "description",
            "date",
            "location",
            "venue",
            "schedule",
            "media",
            "content",
            "overlay"
        ];

        const score =
            eventSignals.filter(
                signal =>
                    keys.some(
                        key => key.includes(signal)
                    )
            ).length;

        if (score >= 2) {
            found.push(node);
        }

        for (const key of Object.keys(node)) {
            walk(node[key], [...path, key]);
        }
    }

    walk(data);

    return deduplicateObjects(found);
}


/* ============================================================
   REMOVE DUPLICATES
   ============================================================ */

function deduplicateObjects(items) {

    const result = [];
    const signatures = new Set();

    for (const item of items) {

        let signature;

        try {
            signature = JSON.stringify(item);
        } catch {
            signature = Math.random();
        }

        if (!signatures.has(signature)) {

            signatures.add(signature);
            result.push(item);
        }
    }

    return result;
}


/* ============================================================
   NORMALIZE ANY EVENT FORMAT
   ============================================================ */

function normalizeEvent(raw) {

    const media =
        raw.media ||
        raw.image ||
        raw.video ||
        raw.poster ||
        raw.thumbnail ||
        {};

    const content =
        raw.content ||
        raw.details ||
        raw.info ||
        {};

    const overlay =
        raw.overlay ||
        raw.textOverlay ||
        {};

    const theme =
        raw.theme ||
        {};

    const action =
        content.action ||
        raw.action ||
        raw.button ||
        {};

    let mediaURL = "";

    if (typeof media === "string") {
        mediaURL = media;
    } else if (isObject(media)) {
        mediaURL =
            media.url ||
            media.src ||
            media.image ||
            media.video ||
            mediaURL;
    }

    /*
     * Automatic media detection from arbitrary fields.
     */

    if (!mediaURL) {

        const candidates = [
            raw.url,
            raw.src,
            raw.imageUrl,
            raw.imageURL,
            raw.videoUrl,
            raw.videoURL,
            raw.photo,
            raw.thumbnail
        ];

        mediaURL =
            candidates.find(
                x => typeof x === "string"
            ) || "";
    }

    const type =
        safeString(
            media.type ||
            raw.type ||
            detectMediaType(mediaURL),
            "none"
        ).toLowerCase();

    return {

        id:
            raw.id ||
            raw.eventId ||
            cryptoRandomID(),

        enabled:
            raw.enabled !== false &&
            raw.active !== false &&
            raw.visible !== false,

        media: {
            type,
            url: mediaURL,

            poster:
                media.poster ||
                raw.poster ||
                raw.thumbnail ||
                "",

            ratio:
                media.ratio ||
                raw.ratio ||
                "4:5",

            width:
                media.width ||
                raw.width ||
                "",

            height:
                media.height ||
                raw.height ||
                "",

            fit:
                media.fit ||
                raw.fit ||
                "cover",

            autoplay:
                media.autoplay === true ||
                raw.autoplay === true,

            muted:
                media.muted !== false,

            loop:
                media.loop === true ||
                raw.loop === true,

            controls:
                media.controls !== false
        },

        overlay: {

            enabled:
                overlay.enabled !== false &&
                (
                    overlay.title ||
                    overlay.subtitle ||
                    overlay.text
                ),

            position:
                overlay.position ||
                "bottom",

            gradient:
                overlay.gradient !== false,

            title:
                overlay.title ||
                content.title ||
                raw.title ||
                "",

            subtitle:
                overlay.subtitle ||
                raw.subtitle ||
                "",

            text:
                overlay.text ||
                "",

            textColor:
                overlay.textColor ||
                "#FFFFFF",

            titleFont:
                overlay.titleFont ||
                "inherit",

            subtitleFont:
                overlay.subtitleFont ||
                "inherit",

            titleSize:
                overlay.titleSize ||
                30,

            subtitleSize:
                overlay.subtitleSize ||
                13
        },

        content: {

            title:
                content.title ||
                raw.title ||
                raw.name ||
                raw.eventName ||
                "Untitled Event",

            description:
                content.description ||
                raw.description ||
                raw.desc ||
                "",

            date:
                content.date ||
                raw.date ||
                "",

            time:
                content.time ||
                raw.time ||
                "",

            location:
                content.location ||
                raw.location ||
                raw.venue ||
                "",

            audience:
                content.audience ||
                raw.audience ||
                "",

            badge:
                content.badge ||
                raw.badge ||
                null,

            action
        },

        theme: {

            background:
                theme.background ||
                "#ffffff",

            textColor:
                theme.textColor ||
                "#151515",

            accentColor:
                theme.accentColor ||
                "#8b5cf6",

            buttonColor:
                theme.buttonColor ||
                theme.accentColor ||
                "#151515",

            buttonTextColor:
                theme.buttonTextColor ||
                "#ffffff",

            borderRadius:
                theme.borderRadius ||
                24
        },

        /*
         * Preserve everything for future features.
         */

        raw
    };
}


/* ============================================================
   MEDIA DETECTION
   ============================================================ */

function detectMediaType(url) {

    if (!url)
        return "none";

    const clean =
        url.split("?")[0].toLowerCase();

    if (
        /\.(mp4|webm|ogg|mov|m4v)$/i.test(clean)
    )
        return "video";

    if (
        /\.(jpg|jpeg|png|webp|gif|avif|svg)$/i.test(clean)
    )
        return "image";

    /*
     * Unknown URLs:
     * image is safer for normal browser rendering.
     */

    return "image";
}


/* ============================================================
   ID
   ============================================================ */

function cryptoRandomID() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {
        return crypto.randomUUID();
    }

    return "event-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2);
}


/* ============================================================
   RATIO
   ============================================================ */

function ratioClass(ratio) {

    const value =
        safeString(ratio)
            .replace(/\s/g, "")
            .toLowerCase();

    if (
        value === "1:1" ||
        value === "square"
    )
        return "ratio-1-1";

    if (
        value === "4:5"
    )
        return "ratio-4-5";

    if (
        value === "16:9"
    )
        return "ratio-16-9";

    if (
        value === "3:4"
    )
        return "ratio-3-4";

    if (
        value === "auto"
    )
        return "ratio-auto";

    return "ratio-4-5";
}
